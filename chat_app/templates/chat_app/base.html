{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}Flexgram{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Иконка (SVG вшита прямо здесь) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1e16'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-weight='bold' font-size='60' fill='%237aaa6a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1e16'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-weight='bold' font-size='60' fill='%237aaa6a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flexgram">
</head>
<body>
    <div class="bg-gradient"></div>
    <nav class="navbar">
        <a href="{% url 'room_list' %}" class="logo">
            <span class="fx">FLEX</span><span class="gram">gram</span>
        </a>
        <div class="navbar-links">
            {% if user.is_authenticated %}
                <span class="user-badge">{{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn-logout">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-login">Войти</a>
                <a href="{% url 'register' %}" class="btn-login">Регистрация</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
